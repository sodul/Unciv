# Just Build the Desktop Jar
# Based on the buildMultiplatform.yml but simplified since we just want the jar here.
name: Build Desktop Jar


on:
  # Empty workflow_dispatch to allow building on demand.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:

  build-desktop:
    defaults:
      run:
        # Ensures that a UNIX-like shell is available (default would be Powershell on Windows)
        shell: sh
    name: Build Desktop for ${{ matrix.os }} (Java ${{ matrix.java_version }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
        java_version:
          - 25

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Desktop app
        run: ./gradlew desktop:dist

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Desktop (built with Java ${{ matrix.java_version }})
          path: desktop/build/libs/*.jar
          retention-days: 1
        # Only run this step on ubuntu-latest, since Java is cross-platform anyways
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
